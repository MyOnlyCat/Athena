services:
  api:
    build:
      context: ./Athena-Node/api
    restart: unless-stopped
    environment:
      ATHENA_ENVIRONMENT: production
      ATHENA_DATABASE_URL: sqlite+aiosqlite:////data/athena-node.db
      ATHENA_DATA_DIR: /data
      ATHENA_JWT_SECRET: ${ATHENA_JWT_SECRET}
      ATHENA_CREDENTIAL_KEY: ${ATHENA_CREDENTIAL_KEY}
      ATHENA_BOOTSTRAP_USERNAME: ${ATHENA_BOOTSTRAP_USERNAME:-admin}
      ATHENA_BOOTSTRAP_PASSWORD: ${ATHENA_BOOTSTRAP_PASSWORD}
      ATHENA_NODE_ID: ${ATHENA_NODE_ID:-athena-node-local}
      ATHENA_NODE_NAME: ${ATHENA_NODE_NAME:-Athena Node}
      ATHENA_MASTER_NODE_URL: ${ATHENA_MASTER_NODE_URL:-}
      ATHENA_NODE_TOKEN: ${ATHENA_NODE_TOKEN:-}
      ATHENA_ALLOW_HTTP_ARTIFACTS: ${ATHENA_ALLOW_HTTP_ARTIFACTS:-false}
      ATHENA_HOST_PROBE_INTERVAL_MINUTES: ${ATHENA_HOST_PROBE_INTERVAL_MINUTES:-5}
    volumes:
      - athena_data:/data

  ui:
    build:
      context: ./Athena-Node/ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ATHENA_HTTP_PORT:-8080}:80"
    volumes:
      - ./Athena-Node/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  athena_data:
