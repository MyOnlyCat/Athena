name: athena-master-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: athena_test
      POSTGRES_USER: athena_test
      POSTGRES_PASSWORD: athena_test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${ATHENA_TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena_test -d athena_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
